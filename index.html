<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Ascii Dungeon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0f12;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100dvw;
        height: 100dvh;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .dpad {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      .dpad[hidden] {
        display: none;
      }
      .dpad-btn {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        border: 2px solid;
        border-radius: 14%;
        background: rgba(255, 255, 255, 0.05);
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }
      .dpad-btn.active {
        background: var(--dpad-active, rgba(255, 255, 255, 0.22));
        filter: brightness(1.8);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
